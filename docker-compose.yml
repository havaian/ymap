version: '3.8'

services:
  # Frontend (Nuxt 4 SSR - Nitro node server on :3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-ymap}-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-/api}
      - NUXT_INTERNAL_API_BASE=${NUXT_INTERNAL_API_BASE:-http://backend:4000/api}
      - NUXT_DASHBOARD_API_URL=${NUXT_DASHBOARD_API_URL:-}
      - NUXT_DASHBOARD_API_KEY=${NUXT_DASHBOARD_API_KEY:-}
      - NUXT_DOPPIX_API_URL=${NUXT_DOPPIX_API_URL:-}
      - NUXT_DOPPIX_API_KEY=${NUXT_DOPPIX_API_KEY:-}
    ports:
      - "${FRONTEND_EXPOSE:-127.0.0.1:7797}:3000"
    depends_on:
      - backend
    networks:
      - ymap-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-ymap}-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - UPLOADS_DIR=/app/uploads
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Confirmation letters. Without SMTP_HOST the link is printed to the backend
      # log instead of being mailed, and registration still completes.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:7797}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Y.Map <no-reply@ymap.ytech.space>}
      - VERIFY_TOKEN_TTL_MS=${VERIFY_TOKEN_TTL_MS:-86400000}
      - VERIFY_RESEND_COOLDOWN_MS=${VERIFY_RESEND_COOLDOWN_MS:-60000}
      - RESET_TOKEN_TTL_MS=${RESET_TOKEN_TTL_MS:-3600000}
    volumes:
      - ./uploads/:/app/uploads:rw,Z
      # Boundary and registry files. Without this mount /app/src/data is image
      # content and therefore ephemeral: fetch-osm-boundaries.js writes
      # osm-regions.geojson inside the running container, the next rebuild
      # recreates the container, and the file the importer needs is gone. That is
      # exactly what happened between the first successful fetch and the import
      # that followed it.
      #
      # The mount also matches what the fetch script was designed for: it runs
      # rarely and writes files that get committed, so the database never depends
      # on Overpass being up at import time.
      #
      # Флаг :z, не :Z. Заглавный переметит каталог в приватную для контейнера
      # SELinux-метку, и тогда доступ к нему потеряет тот, кто делает git checkout.
      # Каталог общий с хостом, ему нужна разделяемая метка.
      #
      # Контейнер работает под USER nodeapp, поэтому каталог на хосте должен
      # принадлежать ему: docker compose exec backend id покажет UID и GID.
      - ./backend/src/data/:/app/src/data:rw,z
    ports:
      - "${BACKEND_EXPOSE:-127.0.0.1:4000}:${BACKEND_PORT:-4000}"
    depends_on:
      - redis
    networks:
      - ymap-network

  # Telegram Bot
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-ymap}-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - YMAP_API_URL=http://backend:${BACKEND_PORT:-4000}/api
      - BOT_EMAIL=${BOT_EMAIL}
      - BOT_PASSWORD=${BOT_PASSWORD}
    depends_on:
      - backend
    networks:
      - ymap-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-ymap}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --port ${REDIS_PORT:-7791}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXPOSE:-127.0.0.1:7791}:${REDIS_PORT:-7791}"
    networks:
      - ymap-network

volumes:
  redis-data:

networks:
  ymap-network:
    driver: bridge